server.port=8080
spring.application.name=pebms-backend

# MySQL Configuration (activate with --spring.profiles.active=mysql)
spring.datasource.url=jdbc:mysql://localhost:3306/pebms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
